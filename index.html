<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Tracking Event - Status & Elevasi</title>
    <!-- CSS Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: Arial, sans-serif;
      }
      .container {
        display: flex;
        height: 100vh;
        width: 100vw;
      }

      /* Panel Sidebar di sebelah kiri */
      #sidebar {
        width: 320px;
        background: #f8f9fa;
        border-right: 1px solid #ddd;
        display: flex;
        flex-direction: column;
        box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        z-index: 1001;
      }
      .sidebar-header {
        padding: 15px;
        background: #2c3e50;
        color: white;
      }
      .sidebar-header h3 {
        margin: 0 0 5px 0;
        font-size: 18px;
      }
      .sidebar-header p {
        margin: 0;
        font-size: 12px;
        color: #bdc3c7;
      }

      /* Daftar nama peserta */
      #participant-list {
        list-style: none;
        padding: 0;
        margin: 0;
        overflow-y: auto;
        flex: 1;
      }
      .participant-item {
        padding: 12px 15px;
        border-bottom: 1px solid #eee;
        cursor: pointer;
        transition: background 0.2s;
      }
      .participant-item:hover {
        background: #e9ecef;
      }
      .participant-name {
        font-weight: bold;
        color: #333;
        font-size: 14px;
      }
      .participant-details {
        font-size: 12px;
        color: #555;
        margin-top: 4px;
        line-height: 1.4;
      }
      .status-online {
        color: #27ae60;
        font-weight: bold;
      }
      .status-offline {
        color: #c0392b;
        font-weight: bold;
      }

      /* Area Peta di sebelah kanan */
      #map {
        flex: 1;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Sidebar Daftar Peserta -->
      <div id="sidebar">
        <div class="sidebar-header">
          <h3>🚴 Live Tracking Peserta</h3>
          <p id="connection-status">Menghubungkan ke server...</p>
        </div>
        <ul id="participant-list">
          <!-- Data peserta akan dimasukkan secara otomatis oleh JavaScript -->
        </ul>
      </div>

      <!-- Peta Leaflet -->
      <div id="map"></div>
    </div>

    <!-- Script Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Script Plugin Leaflet-GPX untuk memuat file rute.gpx -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-gpx/1.7.0/gpx.min.js"></script>

    <script>
      // 1. Inisialisasi Peta
      var map = L.map("map").setView([-6.2, 106.816666], 13);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      // 2. Memuat Garis Rute dari File rute.gpx
      var gpxPath = "rute.gpx";
      new L.GPX(gpxPath, {
        async: true,
        marker_options: { startIcon: null, endIcon: null },
        polyline_options: { color: "red", weight: 4, opacity: 0.8 },
      })
        .on("loaded", function (e) {
          map.fitBounds(e.target.getBounds());
        })
        .addTo(map);

      // 3. Logika Live Tracking & Deteksi Status Offline/Online
      var markers = {};
      const TRACCAR_URL = "https://traccar-production-ff17.up.railway.app";
      // Menggunakan kredensial akun admin Anda
      const AUTH_HEADER = "Basic " + btoa("walikt9@gmail.com:admin14#");

      function fetchGPSData() {
        fetch(`${TRACCAR_URL}/api/positions`, {
          method: "GET",
          headers: {
            Authorization: AUTH_HEADER,
            "Content-Type": "application/json",
            Accept: "application/json",
          },
        })
          .then((response) => {
            if (!response.ok) {
              throw new Error("Gagal terhubung: " + response.status);
            }
            return response.json();
          })
          .then((data) => {
            document.getElementById("connection-status").innerText =
              "Status: Terhubung (Live)";

            var listContainer = document.getElementById("participant-list");
            listContainer.innerHTML = "";

            var currentTime = new Date().getTime();

            data.forEach((pos) => {
              var deviceId = pos.deviceId;
              var lat = pos.latitude;
              var lon = pos.longitude;
              var speed = pos.speed ? Math.round(pos.speed * 1.852) : 0; // Konversi knot ke km/h
              var altitude = pos.altitude ? Math.round(pos.altitude) : 0; // Elevasi dalam meter

              var fixTime = new Date(pos.deviceTime || pos.fixTime).getTime();
              var timeDiff = (currentTime - fixTime) / 1000; // selisih dalam detik

              // Jika data lebih dari 30 detik tidak memperbarui, anggap offline / di luar jangkauan
              var isOffline = timeDiff > 30;
              var statusText = isOffline
                ? '<span class="status-offline">🔴 Di luar jangkauan / GPS Mati</span>'
                : '<span class="status-online">🟢 Aktif (Online)</span>';

              // Update atau buat Marker Peserta di Peta
              if (markers[deviceId]) {
                markers[deviceId].setLatLng([lat, lon]);
              } else {
                markers[deviceId] = L.marker([lat, lon], {
                  icon: L.divIcon({
                    className: "custom-marker",
                    html: `<div style="background:${isOffline ? "#c0392b" : "#27ae60"}; width:14px; height:14px; border-radius:50%; border:2px solid white; box-shadow:0 0 4px rgba(0,0,0,0.4);"></div>`,
                    iconSize: [14, 14],
                    iconAnchor: [7, 7],
                  }),
                }).addTo(map);
              }

              // Update isi Popup Marker
              markers[deviceId].bindPopup(`
                        <b>Peserta ID:</b> ${deviceId}<br>
                        Kecepatan: ${speed} km/h<br>
                        Elevasi: ${altitude} mdpl
                    `);

              // Tambahkan ke Sidebar List dengan detail lengkap
              var listItem = document.createElement("li");
              listItem.className = "participant-item";
              listItem.innerHTML = `
                        <div class="participant-name">Peserta ID: ${deviceId}</div>
                        <div class="participant-details">
                            Status: ${statusText}<br>
                            Kecepatan: <b>${speed} km/h</b> | Elevasi: <b>${altitude} m</b>
                        </div>
                    `;

              // Klik pada nama di sidebar akan mengarahkan peta ke lokasi peserta
              listItem.onclick = function () {
                map.setView([lat, lon], 16);
                markers[deviceId].openPopup();
              };

              listContainer.appendChild(listItem);
            });
          })
          .catch((error) => {
            console.error("Gagal mengambil data:", error);
            document.getElementById("connection-status").innerText =
              "Status: Terputus dari Server";
          });
      }

      // Ambil data GPS secara berkala setiap 5 detik
      setInterval(fetchGPSData, 5000);
      fetchGPSData();
    </script>
  </body>
</html>
