<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Tracking Event - Status & Elevasi</title>
    <!-- CSS Leaflet -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: Arial, sans-serif;
      }
      .container {
        display: flex;
        height: 100vh;
        width: 100vw;
      }

      /* Panel Sidebar di sebelah kiri */
      #sidebar {
        width: 360px;
        background: #f8f9fa;
        border-right: 1px solid #ddd;
        display: flex;
        flex-direction: column;
        box-shadow: 2px 0 5px rgba(0, 0, 0, 0.1);
        z-index: 1001;
      }
      .sidebar-header {
        padding: 15px;
        background: #2c3e50;
        color: white;
      }
      .sidebar-header h3 {
        margin: 0 0 5px 0;
        font-size: 18px;
      }
      .sidebar-header p {
        margin: 0;
        font-size: 12px;
        color: #bdc3c7;
      }

      /* Daftar nama peserta */
      #participant-list {
        list-style: none;
        padding: 0;
        margin: 0;
        overflow-y: auto;
        flex: 1;
      }
      .participant-item {
        padding: 12px 15px;
        border-bottom: 1px solid #eee;
        cursor: pointer;
        transition: background 0.2s;
      }
      .leaderboard {
        padding: 12px 15px;
        border-bottom: 1px solid #ddd;
        background: #fff;
      }
      .leaderboard h4 {
        margin: 0 0 8px;
        color: #2c3e50;
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .leaderboard-row {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 5px 0;
        font-size: 12px;
        border-bottom: 1px solid #f0f0f0;
      }
      .leaderboard-row:last-child {
        border-bottom: 0;
      }
      .leaderboard-rank {
        width: 24px;
        color: #7f8c8d;
        font-weight: bold;
      }
      .leaderboard-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .leaderboard-distance {
        color: #2c3e50;
        font-weight: bold;
      }
      .participant-item:hover {
        background: #e9ecef;
      }
      .participant-name {
        font-weight: bold;
        color: #333;
        font-size: 14px;
      }
      .participant-details {
        font-size: 12px;
        color: #555;
        margin-top: 4px;
        line-height: 1.4;
      }
      .status-online {
        color: #27ae60;
        font-weight: bold;
      }
      .status-offline {
        color: #c0392b;
        font-weight: bold;
      }

      /* Area Peta di sebelah kanan */
      #map {
        flex: 1;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Sidebar Daftar Peserta -->
      <div id="sidebar">
        <div class="sidebar-header">
          <h3>🚴 Live Tracking Peserta</h3>
          <p id="connection-status">Menghubungkan ke server...</p>
        </div>
        <div class="leaderboard">
          <h4>Leaderboard jarak</h4>
          <div id="leaderboard-list">Menunggu data tracking...</div>
        </div>
        <ul id="participant-list">
          <!-- Data peserta akan dimasukkan secara otomatis oleh JavaScript -->
        </ul>
      </div>

      <!-- Peta Leaflet -->
      <div id="map"></div>
    </div>

    <!-- Script Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // 1. Inisialisasi Peta
      var map = L.map("map").setView([-6.2, 106.816666], 13);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);

      // 2. Gambar rute GPX sebagai garis tanpa waypoint atau label otomatis.
      fetch("rute.gpx")
        .then((response) => response.text())
        .then((gpxText) => {
          var xml = new DOMParser().parseFromString(gpxText, "application/xml");
          var routePoints = Array.from(xml.querySelectorAll("trkpt")).map((point) => [
            Number(point.getAttribute("lat")),
            Number(point.getAttribute("lon")),
          ]);

          if (routePoints.length > 1) {
            var route = L.polyline(routePoints, {
              color: "#e74c3c",
              weight: 4,
              opacity: 0.8,
            }).addTo(map);
            map.fitBounds(route.getBounds());
          }
        })
        .catch((error) => console.error("Gagal memuat rute GPX:", error));

      // 3. Logika Live Tracking menggunakan API Vercel Serverless
      var markers = {};
      var participantStats = {};
      var markerColors = ["#16a085", "#8e44ad", "#d35400", "#2980b9", "#c0392b", "#27ae60"];

      function distanceInMeters(firstLat, firstLon, secondLat, secondLon) {
        var earthRadius = 6371000;
        var latitudeDelta = ((secondLat - firstLat) * Math.PI) / 180;
        var longitudeDelta = ((secondLon - firstLon) * Math.PI) / 180;
        var a =
          Math.sin(latitudeDelta / 2) ** 2 +
          Math.cos((firstLat * Math.PI) / 180) *
            Math.cos((secondLat * Math.PI) / 180) *
            Math.sin(longitudeDelta / 2) ** 2;
        return earthRadius * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      }

      function renderLeaderboard() {
        var leaderboard = Object.values(participantStats).sort(
          (first, second) => second.distance - first.distance,
        );
        var container = document.getElementById("leaderboard-list");
        container.innerHTML = leaderboard.length
          ? leaderboard
              .map(
                (participant, index) => `
                  <div class="leaderboard-row">
                    <span class="leaderboard-rank">#${index + 1}</span>
                    <span class="leaderboard-name" style="color:${participant.color}">${participant.deviceId}</span>
                    <span class="leaderboard-distance">${(participant.distance / 1000).toFixed(2)} km</span>
                  </div>`,
              )
              .join("")
          : "Menunggu data tracking...";
      }

      function fetchGPSData() {
        fetch("/api/positions")
          .then((response) => {
            if (!response.ok) {
              throw new Error("HTTP error! status: " + response.status);
            }
            return response.json();
          })
          .then((data) => {
            if (!Array.isArray(data)) {
              throw new Error(data.error || "Format data dari server tidak valid");
            }

            document.getElementById("connection-status").innerText =
              `Status: Terhubung (Live) - ${data.length} peserta`;

            var listContainer = document.getElementById("participant-list");
            listContainer.innerHTML = "";

            var currentTime = new Date().getTime();

            data.forEach((pos) => {
              var deviceId = pos.deviceId;
              var lat = pos.latitude;
              var lon = pos.longitude;
              var speed = pos.speed ? Math.round(pos.speed * 1.852) : 0; // Konversi knot ke km/h
              var altitude = pos.altitude ? Math.round(pos.altitude) : 0; // Elevasi dalam meter

              if (!participantStats[deviceId]) {
                participantStats[deviceId] = {
                  deviceId: deviceId,
                  color: markerColors[Object.keys(participantStats).length % markerColors.length],
                  distance: 0,
                  maxAltitude: altitude,
                  previousLatitude: lat,
                  previousLongitude: lon,
                };
              } else {
                participantStats[deviceId].distance += distanceInMeters(
                  participantStats[deviceId].previousLatitude,
                  participantStats[deviceId].previousLongitude,
                  lat,
                  lon,
                );
                participantStats[deviceId].maxAltitude = Math.max(
                  participantStats[deviceId].maxAltitude,
                  altitude,
                );
                participantStats[deviceId].previousLatitude = lat;
                participantStats[deviceId].previousLongitude = lon;
              }

              var participant = participantStats[deviceId];

              var fixTime = new Date(pos.deviceTime || pos.fixTime).getTime();
              var timeDiff = (currentTime - fixTime) / 1000; // selisih dalam detik

              var isOffline = timeDiff > 30;
              var statusText = isOffline
                ? '<span class="status-offline">🔴 Di luar jangkauan / GPS Mati</span>'
                : '<span class="status-online">🟢 Aktif (Online)</span>';

              // Update atau buat Marker Peserta di Peta
              if (markers[deviceId]) {
                markers[deviceId].setLatLng([lat, lon]);
              } else {
                markers[deviceId] = L.marker([lat, lon], {
                  icon: L.divIcon({
                    className: "custom-marker",
                    html: `<div style="background:${participant.color}; opacity:${isOffline ? 0.55 : 1}; width:14px; height:14px; border-radius:50%; border:2px solid white; box-shadow:0 0 4px rgba(0,0,0,0.4);"></div>`,
                    iconSize: [14, 14],
                    iconAnchor: [7, 7],
                  }),
                }).addTo(map);
              }

              // Update isi Popup Marker
              markers[deviceId].bindPopup(`
                        <b>Peserta ID:</b> ${deviceId}<br>
                        Kecepatan: ${speed} km/h<br>
                        Elevasi saat ini: ${altitude} mdpl<br>
                        Elevasi maksimum: ${participant.maxAltitude} mdpl<br>
                        Jarak terlacak: ${(participant.distance / 1000).toFixed(2)} km
                    `);

              // Tambahkan ke Sidebar List dengan detail lengkap
              var listItem = document.createElement("li");
              listItem.className = "participant-item";
              listItem.innerHTML = `
                        <div class="participant-name">Peserta ID: ${deviceId}</div>
                        <div class="participant-details">
                            Status: ${statusText}<br>
                            Kecepatan: <b>${speed} km/h</b><br>
                            Elevasi: <b>${altitude} mdpl</b> (maks. ${participant.maxAltitude} mdpl)<br>
                            Jarak terlacak: <b>${(participant.distance / 1000).toFixed(2)} km</b>
                        </div>
                    `;

              // Klik pada nama di sidebar akan mengarahkan peta ke lokasi peserta
              listItem.onclick = function () {
                map.setView([lat, lon], 16);
                markers[deviceId].openPopup();
              };

              listContainer.appendChild(listItem);
            });
            renderLeaderboard();
          })
          .catch((error) => {
            console.error("Gagal mengambil data:", error);
            document.getElementById("connection-status").innerText =
              `Status: Terputus - ${error.message}`;
          });
      }

      // Ambil data GPS secara berkala setiap 5 detik
      setInterval(fetchGPSData, 5000);
      fetchGPSData();
    </script>
  </body>
</html>
