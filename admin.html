<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPS Tracker - Device Admin</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: #eef2f5;
        color: #24313d;
        font:
          15px Arial,
          sans-serif;
      }
      main {
        max-width: 820px;
        margin: auto;
        background: #fff;
        padding: 28px;
        border: 1px solid #d9e0e5;
        border-radius: 8px;
      }
      h1 {
        margin-top: 0;
      }
      p {
        line-height: 1.5;
      }
      label {
        display: block;
        margin-top: 16px;
        font-weight: bold;
      }
      input,
      button {
        box-sizing: border-box;
        width: 100%;
        padding: 11px;
        margin-top: 6px;
        border: 1px solid #c7d0d8;
        border-radius: 4px;
        font: inherit;
      }
      button {
        margin-top: 20px;
        background: #1769aa;
        color: #fff;
        border: 0;
        cursor: pointer;
        font-weight: bold;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      code {
        background: #edf2f7;
        padding: 2px 4px;
      }
      #result {
        white-space: pre-wrap;
        margin-top: 20px;
        padding: 14px;
        background: #f6f8fa;
        min-height: 42px;
      }
      .toolbar {
        display: flex;
        gap: 10px;
        align-items: end;
      }
      .toolbar label {
        flex: 1;
      }
      .toolbar button,
      .device-actions button {
        width: auto;
        margin-top: 6px;
      }
      .manage {
        margin-top: 28px;
        border-top: 1px solid #d9e0e5;
        padding-top: 20px;
      }
      .manage h2 {
        margin: 0 0 12px;
        font-size: 20px;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 680px;
      }
      th, td {
        padding: 9px;
        border-bottom: 1px solid #e1e6ea;
        text-align: left;
        font-size: 13px;
      }
      th { background: #edf2f7; }
      .device-actions { white-space: nowrap; }
      .device-actions button { padding: 7px 9px; margin-right: 4px; }
      .edit-button { background: #52606d; }
      .delete-button { background: #c0392b; }
      @media (max-width: 650px) {
        body { padding: 12px; }
        main { padding: 18px; }
        .toolbar { display: block; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Device Admin Traccar</h1>
      <p>
        Impor CSV untuk membuat device peserta. Kolom wajib:
        <code>Name,BIB,Category</code>. Nilai <code>BIB</code> dipakai sebagai
        <code>uniqueId</code>.
      </p>
      <label for="admin-username">Username admin</label>
      <input id="admin-username" value="admin" autocomplete="username" />
      <label for="admin-password">Password admin</label>
      <input
        id="admin-password"
        type="password"
        autocomplete="current-password"
      />
      <label for="csv-file">File CSV peserta</label>
      <input id="csv-file" type="file" accept=".csv,text/csv" />
      <button id="create-button" type="button">Buat device di Traccar</button>
      <div id="result">Belum ada proses.</div>
      <section class="manage">
        <h2>Kelola peserta</h2>
        <div class="toolbar">
          <label for="device-search">Cari peserta atau BIB
            <input id="device-search" type="search" placeholder="Contoh: Aditia atau 1001" />
          </label>
          <button id="refresh-button" type="button">Muat ulang</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Nama</th><th>BIB / Unique ID</th><th>Kategori</th><th>Status</th><th>Aksi</th></tr></thead>
            <tbody id="device-list"><tr><td colspan="5">Belum dimuat.</td></tr></tbody>
          </table>
        </div>
      </section>
    </main>
    <script>
      function parseCsv(text) {
        var lines = text.trim().split(/\r?\n/).filter(Boolean);
        if (lines.length < 2)
          throw new Error("CSV harus memiliki header dan minimal satu data.");
        var separator = lines[0].includes(";") ? ";" : ",";
        var headers = lines
          .shift()
          .replace(/^\uFEFF/, "")
          .split(separator)
          .map((header) => header.trim().toLowerCase().replace(/^['"]|['"]$/g, ""));
        var nameIndex = headers.findIndex((header) => ["name", "nama", "nama peserta", "participant"].includes(header));
        var bibIndex = headers.findIndex((header) => ["bib", "id", "nomor bib", "bib peserta", "uniqueid"].includes(header));
        var categoryIndex = headers.findIndex((header) => ["category", "kategori", "kategori lomba", "race"].includes(header));
        if (nameIndex < 0 || bibIndex < 0)
          throw new Error("Header CSV wajib memiliki Nama/Nama Peserta dan BIB.");
        return lines
          .map((line) => {
            var values = line.split(separator).map((value) => value.trim().replace(/^['"]|['"]$/g, ""));
            return {
              name: values[nameIndex],
              uniqueId: values[bibIndex],
              category: categoryIndex >= 0 ? values[categoryIndex] : "",
            };
          })
          .filter((device) => device.name && device.uniqueId);
      }

      var managedDevices = [];

      function getAdminHeaders() {
        var username = document.getElementById("admin-username").value.trim();
        var password = document.getElementById("admin-password").value;
        return {
          Accept: "application/json",
          "Content-Type": "application/json",
          Authorization: "Basic " + btoa(username + ":" + password),
        };
      }

      function renderDevices() {
        var query = document.getElementById("device-search").value.trim().toLowerCase();
        var rows = managedDevices.filter((device) =>
          `${device.name || ""} ${device.uniqueId || ""} ${device.category || ""}`.toLowerCase().includes(query),
        );
        document.getElementById("device-list").innerHTML = rows.length
          ? rows.map((device) => `
              <tr>
                <td>${device.name || "-"}</td>
                <td>${device.uniqueId || "-"}</td>
                <td>${device.category || "-"}</td>
                <td>${device.status || "unknown"}</td>
                <td class="device-actions">
                  <button class="edit-button" type="button" data-edit="${device.id}">Edit</button>
                  <button class="delete-button" type="button" data-delete="${device.id}">Hapus</button>
                </td>
              </tr>`).join("")
          : '<tr><td colspan="5">Tidak ada peserta.</td></tr>';
      }

      async function loadDevices() {
        var result = document.getElementById("result");
        result.textContent = "Memuat daftar device...";
        try {
          var response = await fetch("/api/devices", { headers: getAdminHeaders() });
          var body = await response.json();
          if (!response.ok) throw new Error(body.error || "Gagal memuat device.");
          managedDevices = Array.isArray(body) ? body : [];
          renderDevices();
          result.textContent = `${managedDevices.length} device dimuat.`;
        } catch (error) {
          result.textContent = error.message;
        }
      }

      async function editDevice(device) {
        var name = prompt("Nama peserta:", device.name || "");
        if (name === null) return;
        var uniqueId = prompt("BIB / Unique ID:", device.uniqueId || "");
        if (uniqueId === null) return;
        var category = prompt("Kategori:", device.category || "");
        if (category === null) return;
        var response = await fetch(`/api/devices?id=${encodeURIComponent(device.id)}`, {
          method: "PUT",
          headers: getAdminHeaders(),
          body: JSON.stringify({ id: device.id, name, uniqueId, category }),
        });
        var body = await response.json();
        if (!response.ok) throw new Error(body.error || "Gagal mengubah device.");
        await loadDevices();
      }

      async function deleteDevice(device) {
        if (!confirm(`Hapus device ${device.name || device.uniqueId}?`)) return;
        var response = await fetch(`/api/devices?id=${encodeURIComponent(device.id)}`, {
          method: "DELETE",
          headers: getAdminHeaders(),
        });
        var body = await response.json();
        if (!response.ok) throw new Error(body.error || "Gagal menghapus device.");
        await loadDevices();
      }

      document
        .getElementById("create-button")
        .addEventListener("click", async function () {
          var result = document.getElementById("result");
          var file = document.getElementById("csv-file").files[0];
          if (!file) {
            result.textContent = "Pilih file CSV terlebih dahulu.";
            return;
          }
          this.disabled = true;
          try {
            var devices = parseCsv(await file.text());
            var response = await fetch("/api/devices", {
              method: "POST",
              headers: getAdminHeaders(),
              body: JSON.stringify(devices),
            });
            var body = await response.json();
            if (!response.ok)
              throw new Error(body.error || "Gagal membuat device.");
            result.textContent =
              `Berhasil memproses ${body.length} device.\n` +
              body
                .map(
                  (item) =>
                    `${item.ok ? "OK" : "GAGAL"} - ${item.name} (${item.uniqueId})`,
                )
                .join("\n");
          } catch (error) {
            result.textContent = error.message;
          } finally {
            this.disabled = false;
          }
        });

      document.getElementById("refresh-button").addEventListener("click", loadDevices);
      document.getElementById("device-search").addEventListener("input", renderDevices);
      document.getElementById("device-list").addEventListener("click", async function (event) {
        var editId = event.target.dataset.edit;
        var deleteId = event.target.dataset.delete;
        var device = managedDevices.find((item) => String(item.id) === String(editId || deleteId));
        if (!device) return;
        try {
          if (editId) await editDevice(device);
          if (deleteId) await deleteDevice(device);
        } catch (error) {
          document.getElementById("result").textContent = error.message;
        }
      });

      document.getElementById("admin-password").addEventListener("change", loadDevices);
    </script>
  </body>
</html>
