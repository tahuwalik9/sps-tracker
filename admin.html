<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPS Tracker - Device Admin</title>
    <style>
      body {
        margin: 0;
        padding: 32px;
        background: #eef2f5;
        color: #24313d;
        font:
          15px Arial,
          sans-serif;
      }
      main {
        max-width: 820px;
        margin: auto;
        background: #fff;
        padding: 28px;
        border: 1px solid #d9e0e5;
        border-radius: 8px;
      }
      h1 {
        margin-top: 0;
      }
      p {
        line-height: 1.5;
      }
      label {
        display: block;
        margin-top: 16px;
        font-weight: bold;
      }
      input,
      button {
        box-sizing: border-box;
        width: 100%;
        padding: 11px;
        margin-top: 6px;
        border: 1px solid #c7d0d8;
        border-radius: 4px;
        font: inherit;
      }
      button {
        margin-top: 20px;
        background: #1769aa;
        color: #fff;
        border: 0;
        cursor: pointer;
        font-weight: bold;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      code {
        background: #edf2f7;
        padding: 2px 4px;
      }
      #result {
        white-space: pre-wrap;
        margin-top: 20px;
        padding: 14px;
        background: #f6f8fa;
        min-height: 42px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Device Admin Traccar</h1>
      <p>
        Impor CSV untuk membuat device peserta. Kolom wajib:
        <code>name,bib,category</code>. Nilai <code>bib</code> dipakai sebagai
        <code>uniqueId</code>.
      </p>
      <label for="admin-username">Username admin</label>
      <input id="admin-username" value="admin" autocomplete="username" />
      <label for="admin-password">Password admin</label>
      <input
        id="admin-password"
        type="password"
        autocomplete="current-password"
      />
      <label for="csv-file">File CSV peserta</label>
      <input id="csv-file" type="file" accept=".csv,text/csv" />
      <button id="create-button" type="button">Buat device di Traccar</button>
      <div id="result">Belum ada proses.</div>
    </main>
    <script>
      function parseCsv(text) {
        var lines = text.trim().split(/\r?\n/).filter(Boolean);
        if (lines.length < 2)
          throw new Error("CSV harus memiliki header dan minimal satu data.");
        var separator = lines[0].includes(";") ? ";" : ",";
        var headers = lines
          .shift()
          .replace(/^\uFEFF/, "")
          .split(separator)
          .map((header) => header.trim().toLowerCase().replace(/^['"]|['"]$/g, ""));
        var nameIndex = headers.findIndex((header) => ["name", "nama", "nama peserta", "participant"].includes(header));
        var bibIndex = headers.findIndex((header) => ["bib", "id", "nomor bib", "bib peserta", "uniqueid"].includes(header));
        var categoryIndex = headers.findIndex((header) => ["category", "kategori", "kategori lomba", "race"].includes(header));
        if (nameIndex < 0 || bibIndex < 0)
          throw new Error("Header CSV wajib memiliki Nama/Nama Peserta dan BIB.");
        return lines
          .map((line) => {
            var values = line.split(separator).map((value) => value.trim().replace(/^['"]|['"]$/g, ""));
            return {
              name: values[nameIndex],
              uniqueId: values[bibIndex],
              category: categoryIndex >= 0 ? values[categoryIndex] : "",
            };
          })
          .filter((device) => device.name && device.uniqueId);
      }

      document
        .getElementById("create-button")
        .addEventListener("click", async function () {
          var result = document.getElementById("result");
          var file = document.getElementById("csv-file").files[0];
          if (!file) {
            result.textContent = "Pilih file CSV terlebih dahulu.";
            return;
          }
          this.disabled = true;
          try {
            var devices = parseCsv(await file.text());
            var username = document
              .getElementById("admin-username")
              .value.trim();
            var password = document.getElementById("admin-password").value;
            var response = await fetch("/api/devices", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Basic " + btoa(username + ":" + password),
              },
              body: JSON.stringify(devices),
            });
            var body = await response.json();
            if (!response.ok)
              throw new Error(body.error || "Gagal membuat device.");
            result.textContent =
              `Berhasil memproses ${body.length} device.\n` +
              body
                .map(
                  (item) =>
                    `${item.ok ? "OK" : "GAGAL"} - ${item.name} (${item.uniqueId})`,
                )
                .join("\n");
          } catch (error) {
            result.textContent = error.message;
          } finally {
            this.disabled = false;
          }
        });
    </script>
  </body>
</html>
